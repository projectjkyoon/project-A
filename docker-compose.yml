version: '3.9'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: expat_tax
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - '6379:6379'
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: npm run dev
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/expat_tax
      WEB_ORIGIN: http://localhost:3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - .:/app
    ports:
      - '4000:4000'
    depends_on:
      - db
      - redis
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    command: npm run dev
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    volumes:
      - .:/app
    ports:
      - '3000:3000'
    depends_on:
      - api
volumes:
  postgres_data:
